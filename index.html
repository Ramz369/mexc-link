<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>mexc-algo</title>
<style>
:root { color-scheme: dark light; }
body { margin:0; min-height:100vh; display:grid; place-items:center;
       font:13px ui-monospace,SFMono-Regular,Menlo,monospace;
       background:#0b0e13; color:#e4e7eb; }
.box { text-align:center; line-height:2.2; }
.dim { opacity:.55; font-size:12px; }
a { color:#6ee7a8; }
</style>
</head>
<body>
<div class="box">
  <div id="status" role="status">looking up the terminal…</div>
  <div class="dim">if nothing happens, <a id="open" href="https://mexcalgo.serveousercontent.com/?serveo-skip-browser-warning=true" rel="noreferrer">open it manually</a></div>
</div>
<script>
(async () => {
  const status = document.getElementById('status');
  const open = document.getElementById('open');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await fetch('./url.txt', { cache: 'no-store', signal: controller.signal });
    if (!response.ok) throw new Error('lookup failed');
    const target = new URL((await response.text()).trim());
    if (target.protocol !== 'https:' || target.username || target.password || target.origin === location.origin) {
      throw new Error('invalid destination');
    }
    open.href = target.href;
    status.textContent = 'opening the terminal…';
    location.replace(target.href);
  } catch (_) {
    status.textContent = 'Unable to look up the terminal. Reload to retry, or use the link below.';
  } finally {
    clearTimeout(timeout);
  }
})();
</script>
</body>
</html>
