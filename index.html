<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>mexc-algo</title>
<style>
:root { color-scheme: dark light; }
body { margin:0; min-height:100vh; display:grid; place-items:center;
       font:13px ui-monospace,SFMono-Regular,Menlo,monospace;
       background:#0b0e13; color:#e4e7eb; }
.box { text-align:center; line-height:2; }
.dim { opacity:.5; font-size:12px; }
a { color:#6ee7a8; }
.err { color:#f0a0a0; }
</style>
</head>
<body>
<div class="box">
  <div id="s">connecting…</div>
  <div class="dim" id="d"></div>
</div>
<script>
const SRC = "url.txt";
const s = document.getElementById("s"), d = document.getElementById("d");
let tries = 0;

function alive(url) {
  return new Promise(resolve => {
    const ctl = new AbortController();
    const timer = setTimeout(() => { ctl.abort(); resolve(false); }, 6000);
    fetch(url, { mode: "no-cors", cache: "no-store", signal: ctl.signal })
      .then(() => { clearTimeout(timer); resolve(true); })
      .catch(() => { clearTimeout(timer); resolve(false); });
  });
}

async function go() {
  tries++;
  try {
    const r = await fetch(SRC + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("status " + r.status);
    const url = (await r.text()).trim();
    if (!/^https:\/\/[a-z0-9.-]+$/i.test(url)) throw new Error("bad target");
    d.innerHTML = 'if nothing happens, <a href="' + url + '">open manually</a>';
    if (await alive(url)) { location.replace(url); return; }
    throw new Error("target not answering");
  } catch (e) {
    s.innerHTML = '<span class="err">terminal is moving address, reconnecting…</span>';
    d.textContent = "attempt " + tries + " · this resolves itself, keep this tab open";
    setTimeout(go, 4000);
  }
}
go();
</script>
</body>
</html>
